# Example GitHub Actions workflow — copy to .github/workflows/proofflow.yml in your repository.
# Verified against the workflow-syntax / secrets docs sources listed in docs/SOURCE_NOTES.md (2026-10-01).
name: ProofFlow acceptance tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # nightly 03:00 JST
jobs:
  proofflow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write   # only needed for the optional PR comment step
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ProofFlow CLI
        run: npm install -g @proofflow/cli   # or: pnpm --filter @proofflow/cli build && node packages/cli/dist/main.js
      - name: Run Critical suite and wait
        id: run
        env:
          PROOFFLOW_URL: ${{ secrets.PROOFFLOW_URL }}       # control plane URL
          PROOFFLOW_TOKEN: ${{ secrets.PROOFFLOW_TOKEN }}   # service token (role: tester/qa_lead), never echoed by the CLI
        run: |
          proofflow run --project my-app --suite critical --env staging --wait --timeout 1800 \
            --comment-file proofflow-comment.md --fail-on failed
        # commit / branch / PR / run id are taken from GITHUB_SHA / GITHUB_REF / GITHUB_RUN_ID automatically
      - name: Comment on PR (explicit opt-in; uses the workflow's own GITHUB_TOKEN, not ProofFlow)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file proofflow-comment.md
      - name: Release gate (only on main)
        if: github.ref == 'refs/heads/main'
        env:
          PROOFFLOW_URL: ${{ secrets.PROOFFLOW_URL }}
          PROOFFLOW_TOKEN: ${{ secrets.PROOFFLOW_TOKEN }}
        run: proofflow gate --project my-app --release "${RELEASE_VERSION:-1.2.0}"   # exit 5 when BLOCKED
