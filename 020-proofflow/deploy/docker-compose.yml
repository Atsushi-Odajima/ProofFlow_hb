# ProofFlow — control plane + PostgreSQL + one runner (+ optional Sample SaaS). Copy .env.example → .env first.
#   docker compose -f deploy/docker-compose.yml up -d --build
# For a laptop / single-server setup you can drop the postgres service and keep PROOFFLOW_DB_DRIVER=sqlite (data in the volume).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proofflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: proofflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      PROOFFLOW_PUBLIC_URL: ${PROOFFLOW_PUBLIC_URL:-http://localhost:8080}
      PROOFFLOW_DB_DRIVER: postgres
      PROOFFLOW_DATABASE_URL: postgresql://proofflow:${POSTGRES_PASSWORD:-change-me}@postgres:5432/proofflow
      PROOFFLOW_MASTER_KEY: ${PROOFFLOW_MASTER_KEY:?set a 32-byte base64 key}
      PROOFFLOW_SIGNING_SECRET: ${PROOFFLOW_SIGNING_SECRET:?set a random secret}
      PROOFFLOW_AI_PROVIDER: ${PROOFFLOW_AI_PROVIDER:-none}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PROOFFLOW_TRUST_PROXY: "1"
    volumes:
      - pfdata:/data
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runner
    environment:
      PROOFFLOW_CONTROL_URL: http://server:8080
      PROOFFLOW_RUNNER_TOKEN: ${PROOFFLOW_RUNNER_TOKEN:?create a runner token in Settings → Runner}
      PROOFFLOW_RUNNER_NAME: compose-runner-1
      PROOFFLOW_RUNNER_CONCURRENCY: "2"
      PROOFFLOW_RUNNER_BROWSERS: chromium,firefox,webkit
      # Only for testing targets on private networks (e.g. the sample-saas service below). Default: private targets are denied.
      PROOFFLOW_RUNNER_ALLOW_PRIVATE: ${PROOFFLOW_RUNNER_ALLOW_PRIVATE:-0}
    shm_size: "1gb"
    depends_on:
      - server
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g

  # Optional demo target. Remove in production.
  sample-saas:
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "packages/sample-saas/dist/server.js"]
    environment:
      PORT: "4100"
      HOST: 0.0.0.0
    volumes:
      - ..:/app:ro
    profiles: ["demo"]

volumes:
  pgdata:
  pfdata:
